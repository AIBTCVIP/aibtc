<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen i18n-loading">
  <!-- app.js 会渲染完整的导航栏和内容 -->

  <!-- Fallback for users with JavaScript disabled -->

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#94a3b8;text-align:center;padding:2rem;">

      <p>This application requires JavaScript to function properly.</p>
      <p style="margin-top:0.5rem;">Please enable JavaScript in your browser settings.</p>
    </div>
  </noscript>

  <!-- Vue 全局版本 - 本地文件 -->

  <!-- Chart.js - 本地文件 (defer for non-blocking load) -->
  <script src="/static/vendor/chart.umd.min.js" defer></script>

  <!-- 国际化模块 -->
  <script src="/static/js/i18n.js"></script>

  <!-- 认证工具 -->
  <script src="/static/js/auth.js"></script>
  
  <!-- 共享导航组件 -->
  <script src="/static/js/nav.js"></script>
  
  <!-- 用户认证脚本 -->
  <script>
    // 异步检查认证状态
    (async function() {
      // 并行执行：初始化国际化 + 检查本地用户
      const i18nPromise = I18n.init({
        defaultLocale: 'zh-CN',
        onLocaleChange: () => {
          // 语言变更时刷新页面
          window.location.reload();
        }
      }).catch((e) => {
        if (window.SafeLog) SafeLog.error('[Index] I18n init failed:', e);
      });
      
      // 先检查本地用户信息（不阻塞 i18n）
      let user = Auth.getUser();
      
      // 等待 i18n 初始化完成
      await i18nPromise;
      
      // 更新 SEO 元标签
      I18n.updateSeoMeta('index');
      
      if (!user || !user.uid) {
        // 本地没有用户信息，检查 Cookie 是否有效
        try {
          const resp = await fetch('/api/user/config', { credentials: 'include' });
          if (resp.ok) {
            // Cookie 有效，获取用户信息并保存
            const data = await resp.json();
            if (data.uid && data.username) {
              Auth.saveUser(data.uid, data.username);
              user = { uid: data.uid, username: data.username };
            }
          }
        } catch (e) {
          if (window.SafeLog) SafeLog.error('Auth check failed:', e);
        }
      }
      
      if (!user || !user.uid) {
        // Cookie 也无效，跳转登录
        window.location.href = '/login.html';
        return;
      }
      
      // 传递用户信息给 app.js（不包含 token）
      window.CURRENT_USER = { 
        username: user.username || '', 
        uid: user.uid || '' 
      };
      
      // 加载业务代码（使用集中版本号）
      loadVersionedScript('/static/app.js');
    })();

    function logout() {
      Auth.logout();
    }
  </script>

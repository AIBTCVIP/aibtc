<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIBTC.VIP - Exchange</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Configure and manage your exchange API connections on AIBTC.VIP.">
  <meta name="keywords" content="exchange API, crypto trading, Binance API, OKX API, Bitget API">
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Security -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  
  <link rel="icon" href="/static/favicon.png" type="image/png">
  
  <!-- Anti-FOUC: Inline critical CSS (renders before any external resource loads) -->
  <style>
    html, body { background-color: #0f172a; margin: 0; }
    body { background-image: linear-gradient(to bottom right, #0f172a, #1e293b, #0f172a); min-height: 100vh; }
    .i18n-loading { opacity: 0 !important; visibility: hidden !important; }
    .i18n-ready { opacity: 1; visibility: visible; transition: opacity 0.15s ease-in; }
    [v-cloak] { display: none !important; }
  </style>
  
  <!-- Common CSS -->
  <link rel="stylesheet" href="/static/css/common.css">
  
  <!-- 集中版本管理（必须最先加载） -->
  <script src="/static/js/version.js"></script>
  
  <!-- Preload critical resources -->
  <link rel="preload" href="/static/vendor/vue.global.prod.js" as="script">
  <link rel="preload" href="/static/js/i18n.js" as="script">
  
  <script src="/static/vendor/tailwind.min.js" defer></script>
</head>

<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen i18n-loading">
  <!-- 共享导航栏 -->
  <div id="shared-nav"></div>
  
  <div id="app" v-cloak class="container mx-auto px-4 py-8 max-w-7xl"></div>

  <script src="/static/vendor/vue.global.prod.js"></script>
  <script src="/static/vendor/chart.umd.min.js"></script>
  <!-- 正确的加载顺序: i18n -> auth -> nav -->
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>

  <script>
    // 初始化 i18n 并加载业务代码
    (async function() {
      try {
        await I18n.init({
          onLocaleChange: () => {
            window.location.reload();
          }
        });
      } catch (e) {
        if (window.SafeLog) SafeLog.error('[Exchange] I18n init failed:', e);
      }
      document.title = t('exchange.pageTitle');

      // 同步检查本地用户信息
      const user = Auth.getUser();
      if (!user || !user.uid) {
        window.location.href = '/login.html';
        return;
      }
      
      // 初始化共享导航
      initSharedNav({
        currentPage: 'dashboard',
        showPageTitle: true,
        pageTitle: t('exchange.pageTitle')
      });
      
      // 传递用户信息给 app.js（不包含 token）
      window.CURRENT_USER = { 
        username: user.username || '', 
        uid: user.uid || '' 
      };
      
      // 从 URL 获取交易所参数
      const urlParams = new URLSearchParams(window.location.search);
      const exchange = urlParams.get('exchange');
      
      // 交易所白名单验证
      const VALID_EXCHANGES = ['binance', 'okx', 'bitget', 'hyperliquid'];
      
      if (!exchange || !VALID_EXCHANGES.includes(exchange.toLowerCase())) {
        // 无效或未指定交易所，重定向到主页
        window.location.href = '/#dashboard';
        return;
      }
      
      // 设置单交易所模式（使用规范化的小写值）
      window.SINGLE_EXCHANGE_MODE = exchange.toLowerCase();
      
      // 加载业务代码（使用集中版本号）
      loadVersionedScript('/static/app.js');
    })();

    function logout() {
      Auth.logout();
    }
  </script>
</body>
</html>

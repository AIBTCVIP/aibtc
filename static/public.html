<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen i18n-loading">
  <!-- app.js 会渲染完整的导航栏和内容 -->
  <div id="app" v-cloak class="container mx-auto px-4 py-8 max-w-7xl"></div>

  <!-- Vue 全局版本 - 本地文件 -->
  <script src="/static/vendor/vue.global.prod.js"></script>

  <!-- Chart.js - 本地文件 (defer for non-blocking load) -->
  <script src="/static/vendor/chart.umd.min.js" defer></script>

  <!-- Auth (needed for nav.js compatibility) -->
  <script src="/static/js/auth.js"></script>
  
  <!-- 共享导航组件 -->
  <script src="/static/js/nav.js"></script>

  <!-- 公开模式配置 -->
  <script>
    // 公开模式标志
    window.PUBLIC_MODE = true;
    
    // 从 URL 提取 token: /dashboard/{token}
    // 安全验证：token 只允许字母数字和连字符，长度 8-64
    const pathParts = window.location.pathname.split('/');
    const rawToken = pathParts[pathParts.length - 1] || '';
    const TOKEN_PATTERN = /^[a-zA-Z0-9\-]{8,64}$/;
    
    if (rawToken && TOKEN_PATTERN.test(rawToken)) {
      window.PUBLIC_TOKEN = rawToken;
    } else {
      window.PUBLIC_TOKEN = '';
      // 无效 token 时静默处理（生产环境不输出日志）
    }
    
    // 公开模式不需要用户信息
    window.CURRENT_USER = {};
    
    // 公开模式不需要 logout 函数，但为了兼容性提供一个空实现
    function logout() {
      window.location.href = '/login.html';
    }
    
    // 初始化 i18n 并加载业务代码
    (async function() {
      try {
        await I18n.init({
          onLocaleChange: () => {
            I18n.updateSeoMeta('public');
            window.location.reload();
          }
        });
        I18n.updateSeoMeta('public');
      } catch (e) {
        if (window.SafeLog) SafeLog.error('[Public] I18n init failed:', e);
      }
      
      // 加载业务代码（使用集中版本号）
      loadVersionedScript('/static/app.js');
    })();
  </script>
</body>
